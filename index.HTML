<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page">
        <h1>My Task List</h1>

        <form id="task-form" class="task-form">
            <div class="field">
                <label for="task-input">Task</label>
                <input id="task-input" type="text" placeholder="e.g. Finish project proposal" autocomplete="off">
            </div>

            <div class="field">
                <label for="priority">Priority</label>
                <select id="priority">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                </select>
            </div>

            <button type="submit" class="add-btn">Add Task</button>
        </form>

        <p id="form-error" class="form-error" hidden>Enter a task name before adding it.</p>

        <section id="task-list" class="task-list">
            <p class="empty-message" id="empty-message">No tasks yet. Add one above to get started.</p>
        </section>
    </main>

    <script src="script.js" defer></script>
</body>
</html>
